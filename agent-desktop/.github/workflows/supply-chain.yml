name: Supply Chain

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '37 9 * * 1'
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit:
    name: Audit
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the secret scan below can walk commits, not just
          # the final tree. A shallow clone would silently reduce it to a
          # working-tree scan.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check release metadata consistency
        shell: bash
        run: scripts/check-release-consistency.sh

      - name: Check npm package and publish policy
        run: node scripts/check-npm-package.js

      - name: Cargo dependency policy
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny --locked check advisories licenses bans sources

      - name: Secret and privacy scan
        shell: pwsh
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e
        run: |
          $archive = "gitleaks_${env:GITLEAKS_VERSION}_windows_x64.zip"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v${env:GITLEAKS_VERSION}/${archive}" -OutFile $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($digest -ne $env:GITLEAKS_SHA256) {
            Write-Host "FAIL: ${archive} digest ${digest} does not match the pinned value"
            exit 1
          }
          Expand-Archive -Path $archive -DestinationPath gitleaks-windows
          node scripts/check-gitleaks-policy.mjs ./gitleaks-windows/gitleaks.exe
          # Scan commit history, not just the checked-out tree: a value added
          # in one commit and removed in a later one stays reachable in branch
          # history, and a tree-only scan would pass it.
          ./gitleaks-windows/gitleaks.exe git . --log-opts=HEAD --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Workflow security audit
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check zizmor==1.25.2
          $zizmor = Join-Path (Split-Path (Get-Command python).Source) 'Scripts\zizmor.exe'
          & $zizmor --persona regular --min-severity medium --min-confidence high .github/workflows
