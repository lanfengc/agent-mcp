[package]
name = "agent-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "ADB-backed Android control CLI and stdio MCP server for AI agents"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
